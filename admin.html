<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Панель Админа — Yalova Realty</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin {max-width:900px;margin:40px auto;padding:20px}
    .hidden{display:none}
    .file-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
  </style>
</head>
<body>
  <div class="container admin">
    <h1>Панель Админа — удалена</h1>
    <div id="loginBox">
      <p>Войдите в систему (логин/пароль задаются в переменных окружения сервера).</p>
      <form id="loginForm">
        <input id="user" placeholder="Логин" required style="margin-right:8px">
        <input id="pass" type="password" placeholder="Пароль" required style="margin-right:8px">
        <button type="submit">Войти</button>
      </form>
      <div id="loginMsg"></div>
    </div>

    <div id="panel" class="hidden">
      <button id="logout">Выйти</button>
      <h2>Загрузка файлов каталога</h2>
      <form id="uploadForm">
        <input type="file" name="file" required>
        <button type="submit">Загрузить</button>
      </form>
      <div id="uploadMsg"></div>

      <h2>Файлы каталога</h2>
      <div id="filesList">Загрузка...</div>
    </div>
  </div>

</body>
</html>
